# Hecatoncheires E2E Test Configuration
# Minimal configuration for Playwright E2E testing

[workspace]
id = "test"
name = "E2E Test Workspace"

# Entity Labels
[labels]
case = "Case"

# Enabled on purpose: the E2E backend runs without Slack, so the feature must
# still stay hidden (fieldConfiguration.allowExistingSlackChannel is false).
[slack]
allow_existing_channel = true

# Minimal field definitions for testing
[[fields]]
id = "category"
name = "Category"
type = "select"
required = true
options = [
  { id = "bug", name = "Bug" },
  { id = "feature", name = "Feature" },
  { id = "task", name = "Task" },
]

[[fields]]
id = "priority"
name = "Priority"
type = "select"
required = false
options = [
  { id = "low", name = "Low" },
  { id = "medium", name = "Medium" },
  { id = "high", name = "High" },
]

[[fields]]
id = "description"
name = "Description"
type = "text"
required = false

# Markdown custom field on Cases: rendered as its own section in the case
# detail main column (below the description), edited in place with a
# Write/Preview toggle.
[[fields]]
id = "runbook"
name = "Runbook"
type = "markdown"
required = false
description = "Markdown notes rendered in the Web UI."

# Enable case-scoped memos so the Memos E2E can create/archive/filter them.
# One optional field keeps memo creation title-only (no required-field gate).
[memo]
description = "E2E test memo definition."

[[memo.fields]]
id = "note"
name = "Note"
type = "text"
required = false
description = "Free-form note body."

# Markdown memo field: rendered in the memo detail modal and given a
# Write/Preview editor in the memo form.
[[memo.fields]]
id = "body"
name = "Body"
type = "markdown"
required = false
description = "Markdown body rendered in the Web UI."

# A Job the Case Agent page can list and the E2E can start manually.
# Its only trigger is a 24h interval, which the scheduled scanner never
# reaches during a test run (the scan is driven by an HTTP tick hook, not a
# timer), so the only run this Job ever produces is the manual one.
# The E2E server has no LLM configured, so the run itself fails — that is
# fine: the assertion is that a manually triggered run appears in the
# history tagged as manual.
[[job]]
id = "manual_probe"
name = "Manual probe"
description = "Started by hand from the Case Agent page."
prompt = "Summarise case {{.Case.ID}}."
events.scheduled = { every = "24h" }
