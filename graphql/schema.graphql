# Assist Logs
type AssistLog {
  id: ID!
  caseId: Int!
  summary: String!
  actions: String!
  reasoning: String!
  nextSteps: String!
  createdAt: Time!
}

type AssistLogConnection {
  items: [AssistLog!]!
  totalCount: Int!
