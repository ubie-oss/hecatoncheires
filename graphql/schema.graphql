scalar Time
scalar JSON
scalar Any

# Workspace
type Workspace {
  id: String!
  name: String!
}

# WorkspaceGroup bundles multiple workspaces for organizational / navigation
# purposes. It is orthogonal: membership never changes a workspace's behavior,
# and a deployment may define zero groups. Configured via --global-config.
type WorkspaceGroup {
  id: String!
  name: String!
  description: String
  workspaces: [Workspace!]!
}

# Field type definitions
enum FieldType {
  TEXT
  NUMBER
  SELECT
  MULTI_SELECT
  USER
  MULTI_USER
  DATE
  URL
  CASE_REF
  MULTI_CASE_REF
  MARKDOWN
}

# FieldOption and FieldDefinition are configuration value objects, not
# entities: `id` is a config key that is only meaningful inside the enclosing
# configuration document. The same id is reused across workspaces AND across
# the two independent field configurations (FieldConfiguration.fields for
# Cases, MemoConfiguration.fields for Memos), so no combination of fields
# here identifies one globally. Clients MUST NOT cache these by identity.
type FieldOption {
  id: String!
  name: String!
  description: String
  metadata: JSON  # Arbitrary metadata (e.g., {"score": 4})
}

type FieldDefinition {
  id: String!
  name: String!
  type: FieldType!
  required: Boolean!
  description: String
  options: [FieldOption!]
  referenceWorkspaceId: String
}

"A referenceable case (non-private, non-draft) used by case_ref fields."
type CaseRef {
  id: Int!
  title: String!
  status: CaseStatus!
  workspaceId: String!
}

type EntityLabels {
  case: String!
}

type FieldConfiguration {
  fields: [FieldDefinition!]!
  labels: EntityLabels!
  actionConfig: ActionConfig!
  # allowExistingSlackChannel reports whether createCase accepts
  # existingSlackChannelID in this workspace: [slack] allow_existing_channel is
  # set, the workspace is in channel mode, and Slack is configured.
  allowExistingSlackChannel: Boolean!
}

# SlackChannelCandidate is a Slack channel the acting user may link a new case
# to. A Slack channel id is globally unique, so `id` alone is its identity.
type SlackChannelCandidate {
  id: String!
  name: String!
  isPrivate: Boolean!
}

# SlackChannelCandidateList is one search result of the existing-channel
# picker.
type SlackChannelCandidateList {
  # At most 50 matching channels, sorted by name.
  channels: [SlackChannelCandidate!]!
  # True when more channels match than `channels` holds; the user narrows the
  # search to see them.
  hasMore: Boolean!
  # When the channel list the search ran on was fetched from Slack. The list
  # is stored per user and refreshed in the background once it is older than
  # 10 minutes; pass refresh: true to fetch it now.
  fetchedAt: Time!
}

# ActionStatusDefinition describes a single action status configurable per
# workspace in TOML. `name` is the display label written by the workspace
# operator in whatever language they prefer. `color` is either a semantic
# preset name or a #RRGGBB hex code. See the user-facing config docs for
# the accepted preset list.
# Like FieldDefinition, this is a configuration value object rather than an
# entity: the same id ("TODO") is defined independently per workspace and,
# within one workspace, separately for Actions (fieldConfiguration.action-
# Config) and for thread-mode Cases (caseStatusConfig). Clients MUST NOT
# cache these by identity.
type ActionStatusDefinition {
  id: ID!
  name: String!
  description: String
  color: String
  emoji: String
}

# ActionConfig is the resolved per-workspace action status configuration.
# `initial` is the id of the status assigned to newly created actions.
# `closed` lists the status ids that are treated as closed for filtering /
# completion checks. `statuses` is the full ordered list to render.
type ActionConfig {
  initial: ID!
  closed: [ID!]!
  statuses: [ActionStatusDefinition!]!
}

# Custom field value
type FieldValue {
  fieldId: String!
  # Value encoded as JSON. Clients parse based on field type from FieldConfiguration.
  value: Any!
  # What the value refers to, resolved from the semantic the field definition
  # sets. null when the field has no semantic or the value is empty. Clients
  # show it alongside value, not instead of it.
  display: FieldValueDisplay
}

# Supplementary information shown under a field value.
type FieldValueDisplay {
  # e.g. "#general" for a slack_channel_id value. null when the name could not
  # be resolved (the service is not configured, the lookup found nothing, or the
  # value does not fit the semantic); clients show that as an error.
  label: String
  # Page the value refers to, e.g. "https://slack.com/archives/C0123ABCD".
  # Set only together with label.
  url: String
}

input FieldValueInput {
  fieldId: String!
  value: Any!
}

# Slack file attachment metadata
type SlackFile {
  id: String!
  name: String!
  mimetype: String!
  filetype: String!
  size: Int!
  urlPrivate: String!
  permalink: String!
  thumbURL: String
}

# Slack Message (stored in case sub-collection)
type SlackMessage {
  id: String!
  channelID: String!
  threadTS: String
  teamID: String!
  userID: String!
  userName: String!
  text: String!
  files: [SlackFile!]!
  createdAt: Time!
}

type SlackMessageConnection {
  items: [SlackMessage!]!
  nextCursor: String!
}

# CaseStatus is the lifecycle state of a Case.
# Lifecycle: DRAFT → OPEN → CLOSED (CLOSED can return to OPEN via reopenCase).
# DRAFT is reserved for entries saved through Slack's "Save as Draft" button
# on the case-creation modal; drafts are visible only to their reporter,
# excluded from the default `cases` listing, and surfaced through the
# dedicated `drafts` query.
enum CaseStatus {
  DRAFT
  OPEN
  CLOSED
}

# Channel user connection for paginated member lists
type ChannelUserConnection {
  items: [SlackUser!]!
  totalCount: Int!
  hasMore: Boolean!
}

# Entity types
type Case {
  id: Int!
  # workspaceId scopes id: Case ids come from a per-workspace counter, so
  # (workspaceId, id) — not id alone — identifies a Case. Clients that cache
  # by identity MUST key on both.
  workspaceId: String!
  title: String!
  description: String
  status: CaseStatus!
  isPrivate: Boolean!
  # isTest marks a case filed for testing/verification, distinguished from
  # production cases in the list and detail UI.
  isTest: Boolean!
  accessDenied: Boolean!
  channelUserCount: Int!
  channelUsers(limit: Int, offset: Int, filter: String): ChannelUserConnection!
  reporterID: String
  reporter: SlackUser
  assigneeIDs: [String!]!
  assignees: [SlackUser!]!
  slackChannelID: String
  slackChannelName: String
  slackChannelURL: String
  # slackThreadTS is set for thread-mode cases (the Slack thread the case is
  # bound to); null for channel-mode cases.
  slackThreadTS: String
  # isThreadBound is true for thread-mode cases (slackThreadTS != ""). The UI
  # uses it to hide the Actions tab and link to the Slack thread.
  isThreadBound: Boolean!
  # boardStatus is the configurable workflow status id (the Kanban column) for
  # thread-mode cases; null for channel-mode cases. Validity is workspace-
  # scoped: resolve display from caseStatusConfig.
  boardStatus: String
  # archivedAt is null for an active case and non-null once archived. There is
  # no derived `archived` boolean; callers derive it from archivedAt != null.
  # An archived case is hidden from the default `cases` listing and the Case
  # board, and is reached through the ARCHIVED archive filter.
  archivedAt: Time
  fields: [FieldValue!]!       # Resolved from case_field_values via DataLoader
  # actions exposes the case's actions. The `filter` argument selects which
  # archive slice to return (ACTIVE / ARCHIVED / ALL); the default ACTIVE
  # matches the historical default for sub-resolvers. Each slice goes
  # through its own dataloader so callers can mix filters within a request.
  actions(filter: ActionArchiveFilter = ACTIVE): [Action!]!
  slackMessages(limit: Int, cursor: String): SlackMessageConnection!
  # Case-specific Markdown snippet appended to the Job system prompt
  # at agent execution time. Empty string when unset.
  agentAdditionalPrompt: String!
  # Sources the agent should consider when running against this Case.
  # Empty list (the default) means "use every Workspace Source"; non-
  # empty narrows the agent to exactly those Sources.
  agentSources: [Source!]!
  createdAt: Time!
  updatedAt: Time!
}

type Action {
  id: Int!
  # workspaceId scopes id, exactly as on Case: Action ids come from a
  # per-workspace counter, so (workspaceId, id) identifies an Action.
  workspaceId: String!
  caseID: Int!
  case: Case
  title: String!
  description: String
  assigneeID: String
  assignee: SlackUser
  slackMessageTS: String
  # Action status id. Validity is workspace-scoped: clients should resolve the
  # display name / color / emoji from FieldConfiguration.actionConfig.
  status: String!
  dueDate: Time
  # archived is true when the action is in the archived state (i.e. hidden from
  # default Kanban / Case detail views). Mirrors archivedAt != null.
  archived: Boolean!
  archivedAt: Time
  createdAt: Time!
  updatedAt: Time!
  messages(limit: Int, cursor: String): SlackMessageConnection!
  events(limit: Int, cursor: String): ActionEventConnection!
  # Web-UI-authored comments on this Action, newest first. Separate from
  # `messages`, which are Slack thread replies ingested from the Action's
  # Slack thread.
  comments(limit: Int, cursor: String): ActionCommentConnection!
  # ActionStep listing under this Action, ordered by createdAt asc.
  steps: [ActionStep!]!
  # Aggregate progress over the Action's steps. Both fields are 0 when the
  # caller cannot access the parent Case (private case + non-member).
  stepProgress: ActionStepProgress!
}

enum ActionEventKind {
  CREATED
  TITLE_CHANGED
  STATUS_CHANGED
  ASSIGNEE_CHANGED
  ARCHIVED
  UNARCHIVED
  STEP_ADDED
  STEP_REMOVED
  STEP_DONE
  STEP_REOPENED
  STEP_TITLE_CHANGED
}

# ActionStep is a small, binary-state work item under an Action. Tracks
# granular progress; surfaces in the Action detail UI and as a done/total
# badge on Kanban cards. WebUI hides metadata other than checkbox + title.
type ActionStep {
  id: String!
  actionID: Int!
  title: String!
  # done mirrors doneAt != null. Convenience for clients that only need the
  # boolean; doneAt is the canonical source.
  done: Boolean!
  doneAt: Time
  doneBy: String
  doneByUser: SlackUser
  createdBy: String!
  createdByUser: SlackUser
  createdAt: Time!
  updatedAt: Time!
}

type ActionStepProgress {
  done: Int!
  total: Int!
}

# ActionArchiveFilter selects which archive slice an action list resolver
# should return.
enum ActionArchiveFilter {
  # ACTIVE returns only non-archived actions. Default for every Action
  # list resolver.
  ACTIVE
  # ARCHIVED returns only archived actions.
  ARCHIVED
  # ALL returns both active and archived actions. Intended for cleanup /
  # batch operations; UI views should use ACTIVE or ARCHIVED.
  ALL
}

# CaseArchiveFilter selects which archive slice the `cases` query returns.
enum CaseArchiveFilter {
  # ACTIVE returns only non-archived cases. Default for every caller, so a
  # client that names no filter never sees archived cases.
  ACTIVE
  # ARCHIVED returns only archived cases (the Cases page's Archived tab).
  ARCHIVED
  # ALL returns both. Intended for inventory / batch use, not for the
  # user-facing tabs.
  ALL
}

# MemoArchiveFilter selects which archive slice a memo list resolver returns.
enum MemoArchiveFilter {
  # ACTIVE returns only non-archived memos. Default for memosByCase.
  ACTIVE
  # ARCHIVED returns only archived memos.
  ARCHIVED
  # ALL returns both active and archived memos.
  ALL
}

# Memo is a Case-scoped note that records facts, observations, hypotheses,
# or decisions accumulated while working the Case. Like a Case it carries
# workspace-defined custom field values.
type Memo {
  id: ID!
  caseID: Int!
  case: Case
  title: String!
  fields: [FieldValue!]!
  # archivedAt is null for an active memo and non-null once archived.
  # There is no derived `archived` boolean; callers derive it from archivedAt != null.
  archivedAt: Time
  createdAt: Time!
  updatedAt: Time!
}

# MemoConfiguration describes a workspace's memo configuration for the WebUI.
# When the workspace has not enabled memos, the resolver returns a non-null
# object with an empty fields list; the frontend uses that to hide the Memos tab.
type MemoConfiguration {
  description: String!
  fields: [FieldDefinition!]!
}

input CreateMemoInput {
  caseID: Int!
  title: String!
  fields: [FieldValueInput!]
}

input UpdateMemoInput {
  id: ID!
  caseID: Int!
  title: String
  fields: [FieldValueInput!]
}

# Tag — a workspace-wide, first-class classification label. Tags are created
# explicitly (createTag) and referenced by Knowledge via their immutable id. The
# name is optional and mutable.
type Tag {
  id: ID!
  name: String
  createdAt: Time!
  updatedAt: Time!
}

# Knowledge — workspace-wide shared knowledge entries. Unlike Memo, knowledge is
# not scoped to a case and carries no custom fields: a single Markdown claim body
# plus tags. Tags are resolved from the referenced tag ids. The embedding vector
# used for semantic search is intentionally not exposed through the GraphQL
# surface.
type Knowledge {
  id: ID!
  title: String!
  # claim is a single Markdown text body (empty string when not yet written).
  claim: String!
  tags: [Tag!]!
  createdAt: Time!
  updatedAt: Time!
}

input CreateKnowledgeInput {
  title: String!
  claim: String
  # At least one existing tag id is required. Tags must be created beforehand.
  tagIds: [ID!]!
}

input UpdateKnowledgeInput {
  id: ID!
  title: String
  claim: String
  # Omit to leave unchanged; when provided it must contain at least one existing tag id.
  tagIds: [ID!]
}

# ActionEvent records a single change to an Action, surfaced in the
# WebUI activity feed alongside thread messages.
type ActionEvent {
  id: String!
  actionID: Int!
  kind: ActionEventKind!
  actorID: String!
  actor: SlackUser
  oldValue: String!
  newValue: String!
  createdAt: Time!
}

type ActionEventConnection {
  items: [ActionEvent!]!
  nextCursor: String!
}

# ActionComment is a comment written on an Action from the Web UI. It is never
# reproduced as a Slack message; creating one only announces it in the Action's
# Slack thread with a deep link and a short excerpt.
type ActionComment {
  id: String!
  actionID: Int!
  authorID: String!
  author: SlackUser
  # body is Markdown source. Clients render it through the shared Markdown
  # renderer, which does not enable raw HTML.
  body: String!
  createdAt: Time!
  updatedAt: Time!
  # edited mirrors updatedAt > createdAt.
  edited: Boolean!
}

type ActionCommentConnection {
  items: [ActionComment!]!
  nextCursor: String!
}

# Inputs
input CreateCaseInput {
  title: String!
  description: String
  assigneeIDs: [String!]
  fields: [FieldValueInput!]
  isPrivate: Boolean
  # isTest marks the case as a test case. Defaults to false when omitted.
  isTest: Boolean
  # existingSlackChannelID links the new case to this existing Slack channel
  # instead of creating one. Accepted only when
  # fieldConfiguration.allowExistingSlackChannel is true. isPrivate must be
  # omitted or null (true and false are both rejected); the case's privacy
  # follows the channel.
  existingSlackChannelID: String
}

# CreateDraftInput mirrors CreateCaseInput but every field is optional —
# drafts are by definition in-progress and the user may save with an empty
# title, no assignees, etc. The eventual SubmitDraft is what enforces a
# non-empty title before promoting the case to OPEN.
input CreateDraftInput {
  title: String
  description: String
  assigneeIDs: [String!]
  fields: [FieldValueInput!]
  isPrivate: Boolean
  # isTest marks the draft as a test case. Defaults to false when omitted.
  isTest: Boolean
}

input UpdateCaseInput {
  id: Int!
  # All fields below are optional. Omitted fields preserve their current value
  # on the existing Case. This allows true partial updates from clients that
  # only want to change one thing. Assignees are NOT updatable here — use the
  # assignCase / unassignCase delta mutations so concurrent edits cannot
  # clobber one another.
  title: String
  description: String
  fields: [FieldValueInput!]
  # isTest, when provided, sets the test flag; omit to preserve the current value.
  isTest: Boolean
}

# SubmitDraftInput carries the last-minute edits that the user wants to
# apply *atomically* before the draft is promoted to OPEN. Pre-submit edit
# and promote-to-OPEN are one business operation, so they go through one
# usecase call — splitting them across an updateCase + submitDraft pair
# at the client risks leaving an inconsistent draft behind on failure.
# Assignees are NOT part of this input — manage them via assignCase /
# unassignCase on the draft before submitting.
input SubmitDraftInput {
  title: String
  description: String
  fields: [FieldValueInput!]
  # isTest, when provided, sets the test flag before the draft is promoted.
  isTest: Boolean
}

input CreateActionInput {
  caseID: Int!
  title: String!
  description: String
  assigneeID: String
  slackMessageTS: String
  # Status id. Must match a status defined for the workspace.
  status: String
  dueDate: Time
}

input UpdateActionInput {
  id: Int!
  caseID: Int
  title: String
  description: String
  assigneeID: String
  slackMessageTS: String
  # Status id. Must match a status defined for the workspace.
  status: String
  dueDate: Time
  clearDueDate: Boolean
  clearAssignee: Boolean
}

input UpdateCaseStatusInput {
  id: Int!
  # Board status id. Must match a status defined in the workspace's
  # [case.status] configuration.
  status: String!
}

input AddActionStepInput {
  actionId: Int!
  title: String!
}

input SetActionStepDoneInput {
  actionId: Int!
  stepId: String!
  done: Boolean!
}

input RenameActionStepInput {
  actionId: Int!
  stepId: String!
  title: String!
}

input DeleteActionStepInput {
  actionId: Int!
  stepId: String!
}

input CreateActionCommentInput {
  actionId: Int!
  body: String!
}

input UpdateActionCommentInput {
  actionId: Int!
  commentId: String!
  body: String!
}

input DeleteActionCommentInput {
  actionId: Int!
  commentId: String!
}

# Slack User
type SlackUser {
  id: String!
  name: String!
  realName: String!
  imageUrl: String
}

